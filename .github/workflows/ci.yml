name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m venv .venv && .venv/bin/pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: cd backend && ../.venv/bin/ruff check .
      - name: Type check (mypy, strict on the engine)
        run: cd backend && ../.venv/bin/mypy -p procure_engine
      - name: No policy constants or hard-coded IDs in the engine
        run: .venv/bin/python scripts/check_no_policy_constants.py
      - name: Tests (golden, snapshot, boundaries, invariants, policy drills, API, chat)
        run: cd backend && PYTHONUTF8=1 ../.venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: frontend/dist }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: frontend/dist }
      - run: python -m venv .venv && .venv/bin/pip install -e backend
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: bash scripts/e2e.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t corvo-procure .
