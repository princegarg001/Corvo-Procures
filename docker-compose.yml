# One command: docker compose up  →  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: corvo
      POSTGRES_DB: corvo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvo -d corvo"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://corvo:corvo@db:5432/corvo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_TZ: Asia/Kolkata
      SEED_ON_START: "true"
      SEED_DEMO_RUN: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
